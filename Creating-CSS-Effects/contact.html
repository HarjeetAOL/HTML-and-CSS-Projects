<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description"
          content="Contact The Pet Shop for inquiries, pet care questions, and customer support.">

    <title>The Pet Shop - Contact Us</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header and navigation -->
    <header>
        <h1 class="animate-text">Contact The Pet Shop</h1>

        <nav class="nav-bar">
            <a href="index.html">Home</a> |
            <a href="cats.html">Cats &amp; Kittens</a> |
            <a href="dogs.html">Dogs &amp; Puppies</a> |
            <a href="contact.html">Contact Us</a> |
            <a href="https://learncodinganywhere.com/" target="_blank" rel="noopener">
                The Tech Academy
            </a>
        </nav>
    </header>

    <main>

        <h2>Send Us a Message</h2>

        <!-- Contact form -->
        <form action="#" method="post">

            <h3 id="contact-h3">Please provide your contact information</h3>

            <p>
                <label for="fname">First Name:</label><br>
                <input type="text"
                       id="fname"
                       name="fname"
                       placeholder="First Name"
                       required>
            </p>

            <p>
                <label for="email">Email Address:</label><br>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="example@email.com"
                       required>
            </p>

            <p>
                <label for="phone">Phone Number:</label><br>
                <input type="tel"
                       id="phone"
                       name="phone"
                       placeholder="123-456-7890">
            </p>

            <p>
                <input type="checkbox"
                       id="newsletter"
                       name="newsletter"
                       value="yes">

                <label for="newsletter">Subscribe to our newsletter</label>
            </p>

            <p>
                <label for="message">Your Message:</label><br>

                <textarea id="message"
                          name="message"
                          rows="5"
                          cols="30"
                          placeholder="Type message here..."></textarea>
            </p>

            <p>
                <input type="submit" value="Submit">
            </p>

        </form>

    </main>

    <footer>
        <p>The Pet Shop &copy; 2026. All Rights Reserved.</p>
    </footer>

</body>
</html>
